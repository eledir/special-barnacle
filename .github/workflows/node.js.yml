# CI workflow per Node.js
# -------------------------------------------------------------
# ISTRUZIONI D’USO DEI PRINCIPALI STEPS:
# 1. Checkout repository
#    - Recupera il codice della repository per permettere alla CI di lavorare sui file.
# 2. Setup Node.js
#    - Imposta la versione di Node.js specificata nella matrice.
#    - Abilita il caching delle dipendenze per velocizzare le esecuzioni successive.
# 3. Install dependencies (npm ci)
#    - Installa le dipendenze esattamente come definite nel package-lock.json.
#    - Garantisce riproducibilità dell'ambiente.
# 4. Run Lint
#    - Controlla lo stile del codice e segnala problemi statici.
# 5. Run Build
#    - Compila o prepara il progetto, se previsto.
# 6. Run Tests
#    - Esegue la suite di test.
#    - Genera report JUnit per analisi dettagliata.
# 7. Upload Test Reports
#    - Salva i report come artefatti scaricabili dalla UI di GitHub Actions.
# 8. Upload Coverage
#    - Carica i report di code coverage se disponibili.
# 9. Comment PR with summary
#    - Inserisce automaticamente un commento con l’esito della CI nella Pull Request.
# -------------------------------------------------------------
# Questo file definisce la pipeline di Continuous Integration.
# Viene eseguito automaticamente in queste situazioni:
# - Ad ogni push su qualsiasi branch
# - Ad ogni apertura o aggiornamento di una Pull Request
# Obiettivi principali:
# - Installare dipendenze
# - Eseguire lint, build e test
# - Generare report JUnit e coverage
# - Caricare artefatti utili per il debug
# - Segnalare lo stato della CI nelle Pull Request

name: CI — Node.js Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Build
        run: npm run build --if-present

      - name: Run Tests (JUnit output)
        run: |
          mkdir -p reports
          npm test -- \
            --reporter mocha-junit-reporter \
            --reporter-options mochaFile=reports/junit.xml
        continue-on-error: false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node${{ matrix.node-version }}
          path: reports/

      - name: Upload Coverage (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ✅ CI Status: ${{ job.status }}
            - Node.js: ${{ matrix.node-version }}
            - Test report e coverage disponibili come artefatti.
